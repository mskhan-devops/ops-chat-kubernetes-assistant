<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From manifest to fixed pod — the whole story</title>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--bg:#f8fafc;--you:#6366f1;--trigger:#16a34a;--ai:#f59e0b;--k8s:#326CE5;--hitl:#7c3aed;--mut:#dc2626;--ret:#0ea5e9;--redis:#D82C20;--ord:#d97706;--pay:#0891b2}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(1100px 520px at 85% -10%, #ecfdf5 0%, transparent 60%),radial-gradient(900px 480px at -5% 115%, #eef2ff 0%, transparent 55%),var(--bg);padding:22px 18px 36px}
  .wrap{max-width:1500px;margin:0 auto}
  header{text-align:center;margin-bottom:6px}
  h1{font-size:30px;margin:6px 0 10px;font-weight:800;letter-spacing:-.02em}
  h1 .grad{background:linear-gradient(90deg,var(--k8s),var(--trigger));-webkit-background-clip:text;background-clip:text;color:transparent}
  .acts{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
  .act{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:#e2e8f0;color:#475569;cursor:pointer}
  .act.on{background:var(--ink);color:#fff}
  svg{width:100%;height:auto;display:block}
  svg[hidden]{display:none}
  .box rect{fill:#fff;rx:18;filter:drop-shadow(0 14px 22px rgba(15,23,42,.14));stroke-width:3;transition:filter .4s}
  .box .t{font-size:19px;font-weight:800;fill:var(--ink);text-anchor:middle}
  .box .s{font-size:13px;fill:var(--muted);text-anchor:middle}
  .box .c{font-size:12px;font-weight:700;fill:#475569;font-family:ui-monospace,Menlo,monospace;text-anchor:middle}
  .b-you rect{stroke:var(--you)} .b-trigger rect{stroke:var(--trigger)} .b-ai rect{stroke:var(--ai)} .b-k8s rect{stroke:var(--k8s)}
  .b-redis rect{stroke:var(--redis)} .b-ord rect{stroke:var(--ord)} .b-pay rect{stroke:var(--pay)}
  .box.glow rect{filter:drop-shadow(0 0 22px rgba(22,163,74,.55))}
  .zone{fill:#fff;opacity:.55;stroke:var(--k8s);stroke-width:2;stroke-dasharray:3 7;rx:24}
  .zlabel{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;fill:var(--k8s)}
  .pod rect{rx:12;stroke-width:2}
  .pod text{font-size:12.5px;font-weight:800;text-anchor:middle;font-family:ui-monospace,Menlo,monospace}
  .pod.ok rect{fill:#dcfce7;stroke:#16a34a} .pod.ok text{fill:#166534}
  .pod.bad rect{fill:#fee2e2;stroke:#dc2626} .pod.bad text{fill:#991b1b}
  .svc rect{fill:#eef2ff;stroke:var(--you);stroke-width:1.5;rx:10}
  .svc text{font-size:12px;font-weight:700;fill:#3730a3;text-anchor:middle;font-family:ui-monospace,Menlo,monospace}
  .yaml rect{fill:#0f172a;rx:14;filter:drop-shadow(0 14px 22px rgba(15,23,42,.25))}
  .yaml text{font-family:ui-monospace,Menlo,monospace;font-size:13px;fill:#e2e8f0}
  .yaml .k{fill:#7dd3fc} .yaml .v{fill:#fde68a} .yaml .cm{fill:#94a3b8} .yaml .hot{fill:#fca5a5;font-weight:800}
  .term rect{fill:#0f172a;rx:14;filter:drop-shadow(0 14px 22px rgba(15,23,42,.25))}
  .term text{font-family:ui-monospace,Menlo,monospace;font-size:14.5px;fill:#e2e8f0;white-space:pre}
  .term .p{fill:#4ade80;font-weight:800} .term .out{fill:#94a3b8} .term .bad{fill:#fca5a5;font-weight:800} .term .good{fill:#86efac}
  .term .dot{stroke:none}
  .wire{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:10 10;animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-20}}
  .w-you{stroke:var(--you)} .w-ai{stroke:var(--ai)} .w-k8s{stroke:var(--k8s)} .w-hitl{stroke:var(--hitl)} .w-mut{stroke:var(--mut)} .w-ret{stroke:var(--ret)}
  .pkt{filter:drop-shadow(0 0 6px currentColor)}
  .p-you{fill:var(--you);color:var(--you)} .p-ai{fill:var(--ai);color:var(--ai)} .p-k8s{fill:var(--k8s);color:var(--k8s)} .p-hitl{fill:var(--hitl);color:var(--hitl)} .p-mut{fill:var(--mut);color:var(--mut)} .p-ret{fill:var(--ret);color:var(--ret)}
  .lbl{font-size:14px;font-weight:800;fill:#1e293b;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .lbl.small{font-size:12.5px;font-weight:700;fill:#475569}
  .badge rect{rx:12;stroke-width:0} .badge text{font-size:13px;font-weight:800;text-anchor:middle}
  .badge.green rect{fill:#dcfce7} .badge.green text{fill:#166534}
  .badge.purple rect{fill:#ede9fe} .badge.purple text{fill:#5b21b6}
  .badge.red rect{fill:#fee2e2} .badge.red text{fill:#991b1b}
  .badge.blue rect{fill:#dbeafe} .badge.blue text{fill:#1e40af}
  .badge.amber rect{fill:#fef3c7} .badge.amber text{fill:#92400e}
  .card rect{fill:#f5f3ff;stroke:var(--hitl);stroke-width:2;rx:10}
  .card text{font-size:12px;font-weight:700;fill:#3b0764;text-anchor:middle}
  .card .ok{fill:#dcfce7} .card .no{fill:#fee2e2}
  .num circle{fill:var(--ink)} .num text{fill:#fff;font-size:13px;font-weight:800;text-anchor:middle}
  [data-step]{transition:opacity .5s ease}
  [data-step].off{opacity:0;pointer-events:none}
  [data-step].done{opacity:.3}
  [data-step].fresh{animation:pop .7s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  .caption{margin:6px auto 0;max-width:1150px;min-height:90px;text-align:center}
  .caption b{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em}
  .caption span{display:block;font-size:15px;color:var(--muted);margin-top:4px}
  .caption code[hidden]{display:none} .caption code{display:inline-block;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#0f172a;color:#4ade80;padding:6px 14px;border-radius:8px;user-select:all}
  .ctrl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}
  .ctrl button{font:inherit;font-weight:800;font-size:15px;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;background:#e2e8f0;color:var(--ink)}
  .ctrl button.play{background:var(--trigger);color:#fff;box-shadow:0 8px 18px -8px var(--trigger)}
  .ctrl button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:block;transition:background .3s}.dots i.on{background:var(--trigger)}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
</style>
</head>

        el.classList.toggle("off", s > local); el.classList.toggle("done", s < local); el.classList.toggle("fresh", fresh && s === local); }); });
    acts.forEach(el => el.classList.toggle("on", +el.dataset.act === act));
    ["you","trigger","ai","k8s"].forEach(k => { const b = document.getElementById("bx-"+k); if (b) b.classList.toggle("glow", cur > 0 && steps[cur-1][4] === k); });
    const st = cur ? steps[cur-1] : null;
    cap.querySelector("b").textContent = st ? `${local}. ${st[1]}` : "Press ▶ Play — or use the arrow keys";
    cap.querySelector("span").textContent = st ? st[2] : "Three acts: the cluster, bringing it up, and the incident the agent fixes.";
    const code = cap.querySelector("code"); code.hidden = !(st && st[3]); if (st && st[3]) code.textContent = st[3];
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i < cur));
    prevB.disabled = cur === 0; nextB.disabled = cur === MAX;
  }
  function go(d){ const n = Math.min(MAX, Math.max(0, cur + d)); if (n !== cur){ cur = n; render(d > 0); } if (cur === MAX) stop(); }
  function play(){ if (cur === MAX) cur = 0; timer = setInterval(() => go(1), 5000); playB.textContent = "⏸ Pause"; go(1); }
  function stop(){ clearInterval(timer); timer = null; playB.textContent = "▶ Play the story"; }
  playB.onclick = () => timer ? stop() : play();
  prevB.onclick = () => { stop(); go(-1); }; nextB.onclick = () => { stop(); go(1); };
  acts.forEach(el => el.onclick = () => { stop(); cur = firstOf(+el.dataset.act) + 1; render(true); });
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); stop(); go(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stop(); go(-1); }
    else if (e.key === " ") { e.preventDefault(); timer ? stop() : play(); }
  });
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("step")) cur = Math.min(MAX, Math.max(0, +h.get("step") || 0));
  if (h.has("clean")) { document.querySelector(".ctrl").style.display = "none"; document.querySelector(".hint").style.display = "none"; }
  render(false);
</script>
</body>
