<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How the agent is built — code walkthrough</title>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--bg:#f8fafc;--you:#6366f1;--next:#2563eb;--trigger:#16a34a;--ai:#f59e0b;--k8s:#326CE5;--hitl:#7c3aed;--mut:#dc2626;--ret:#0ea5e9}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(1100px 520px at 85% -10%, #ecfdf5 0%, transparent 60%),radial-gradient(900px 480px at -5% 115%, #eef2ff 0%, transparent 55%),var(--bg);padding:22px 18px 36px}
  .wrap{max-width:1500px;margin:0 auto}
  header{text-align:center;margin-bottom:6px}
  h1{font-size:30px;margin:6px 0 10px;font-weight:800;letter-spacing:-.02em}
  h1 .grad{background:linear-gradient(90deg,var(--you),var(--trigger));-webkit-background-clip:text;background-clip:text;color:transparent}
  .acts{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
  .act{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:#e2e8f0;color:#475569;cursor:pointer}
  .act.on{background:var(--ink);color:#fff}
  svg{width:100%;height:auto;display:block}
  .box rect{fill:#fff;rx:16;filter:drop-shadow(0 12px 20px rgba(15,23,42,.13));stroke-width:3;transition:filter .4s}
  .box .t{font-size:16px;font-weight:800;fill:var(--ink);text-anchor:middle}
  .box .f{font-size:11.5px;font-weight:700;fill:#475569;font-family:ui-monospace,Menlo,monospace;text-anchor:middle}
  .b-you rect{stroke:var(--you)} .b-next rect{stroke:var(--next)} .b-trigger rect{stroke:var(--trigger)} .b-ai rect{stroke:var(--ai)} .b-k8s rect{stroke:var(--k8s)}
  .box.glow rect{filter:drop-shadow(0 0 22px rgba(99,102,241,.6))}
  .box.glowg rect{filter:drop-shadow(0 0 22px rgba(22,163,74,.6))}
  .code rect{fill:#0f172a;rx:14;filter:drop-shadow(0 14px 22px rgba(15,23,42,.25))}
  .code .h{font-size:12px;font-weight:800;fill:#94a3b8;font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em}
  .code text{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;fill:#e2e8f0;white-space:pre}
  .code .c{fill:#94a3b8;font-style:italic} .code .hot{fill:#fca5a5;font-weight:800} .code .k{fill:#7dd3fc} .code .s{fill:#fde68a} .code .g{fill:#86efac}
  .plain rect{fill:#fff;rx:14;stroke:#e2e8f0;stroke-width:2;filter:drop-shadow(0 10px 18px rgba(15,23,42,.08))}
  .plain .ttl{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;fill:var(--muted)}
  .plain .li{font-size:15px;font-weight:600;fill:#1e293b}
  .term rect{fill:#0f172a;rx:14;filter:drop-shadow(0 14px 22px rgba(15,23,42,.25))}
  .term text{font-family:ui-monospace,Menlo,monospace;font-size:14.5px;fill:#e2e8f0;white-space:pre}
  .term .p{fill:#4ade80;font-weight:800} .term .out{fill:#94a3b8}
  .wire{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:10 10;animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-20}}
  .w-you{stroke:var(--you)} .w-next{stroke:var(--next)} .w-trigger{stroke:var(--trigger)} .w-ai{stroke:var(--ai)} .w-k8s{stroke:var(--k8s)} .w-hitl{stroke:var(--hitl)} .w-mut{stroke:var(--mut)} .w-ret{stroke:var(--ret)}
  .pkt{filter:drop-shadow(0 0 6px currentColor)}
  .p-you{fill:var(--you);color:var(--you)} .p-next{fill:var(--next);color:var(--next)} .p-trigger{fill:var(--trigger);color:var(--trigger)} .p-ai{fill:var(--ai);color:var(--ai)} .p-k8s{fill:var(--k8s);color:var(--k8s)} .p-hitl{fill:var(--hitl);color:var(--hitl)} .p-mut{fill:var(--mut);color:var(--mut)} .p-ret{fill:var(--ret);color:var(--ret)}
  .lbl{font-size:13px;font-weight:800;fill:#1e293b;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
  .num circle{fill:var(--ink)} .num text{fill:#fff;font-size:13px;font-weight:800;text-anchor:middle}
  [data-step]{transition:opacity .5s ease}
  [data-step].off{opacity:0;pointer-events:none}
  [data-step].done{opacity:.3}
  [data-step].fresh{animation:pop .7s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  .caption{margin:6px auto 0;max-width:1150px;min-height:90px;text-align:center}
  .caption b{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em}
  .caption span{display:block;font-size:15px;color:var(--muted);margin-top:4px}
  .caption code[hidden]{display:none} .caption code{display:inline-block;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#0f172a;color:#4ade80;padding:6px 14px;border-radius:8px;user-select:all}
  .ctrl{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}
  .ctrl button{font:inherit;font-weight:800;font-size:15px;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;background:#e2e8f0;color:var(--ink)}
  .ctrl button.play{background:var(--trigger);color:#fff;box-shadow:0 8px 18px -8px var(--trigger)}
  .ctrl button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:block;transition:background .3s}.dots i.on{background:var(--trigger)}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
</style>
</head>

<div class="wrap">
  <header>
    <h1>How the agent is built — <span class="grad">the code, in plain English</span></h1>
    <div class="acts"><span class="act" data-act="0">1 · Run it yourself</span><span class="act" data-act="1">2 · The chat UI</span><span class="act" data-act="2">3 · Wiring in Trigger.dev</span></div>
  </header>

  <!-- ================= ACT 1 · COMMANDS ================= -->
  <svg id="act0" viewBox="0 0 1500 600" role="img" aria-label="Run it yourself">
    <g data-step="1"><g class="term"><rect x="60" y="30" width="1380" height="66"/>
      <text x="86" y="58"><tspan class="p">$</tspan> git clone https://github.com/rahulwagh/trigger-dev-ai-agent.git</text>
      <text x="86" y="82"><tspan class="p">$</tspan> cd trigger-dev-ai-agent/phase2-chat-agent</text></g>
      <g class="num"><circle cx="60" cy="30" r="13"/><text x="60" y="35">1</text></g></g>
    <g data-step="2"><g class="term"><rect x="60" y="112" width="1380" height="50"/>
      <text x="86" y="143"><tspan class="p">$</tspan> npm install        <tspan class="out"># Next.js · Vercel AI SDK · @trigger.dev/sdk · @ai-sdk/openai</tspan></text></g>
      <g class="num"><circle cx="60" cy="112" r="13"/><text x="60" y="117">2</text></g></g>
    <g data-step="3"><g class="term"><rect x="60" y="178" width="1380" height="90"/>
      <text x="86" y="206"><tspan class="p">$</tspan> cp .env.example .env.local     <tspan class="out"># then paste your two keys:</tspan></text>
      <text x="86" y="230"><tspan class="out">  TRIGGER_SECRET_KEY=tr_dev_…  (cloud.trigger.dev → project → API keys)   OPENAI_API_KEY=sk-…</tspan></text>
      <text x="86" y="254"><tspan class="p">$</tspan> cp .env.local .env             <tspan class="out"># the Trigger worker reads .env, Next.js reads .env.local</tspan></text></g>
      <g class="num"><circle cx="60" cy="178" r="13"/><text x="60" y="183">3</text></g></g>
    <g data-step="4"><g class="term"><rect x="60" y="284" width="1380" height="50"/>
      <text x="86" y="315"><tspan class="p">$</tspan> npx trigger.dev@latest init -p &lt;your-project-ref&gt;   <tspan class="out"># links this folder to your Trigger.dev project</tspan></text></g>
      <g class="num"><circle cx="60" cy="284" r="13"/><text x="60" y="289">4</text></g></g>
    <g data-step="5"><g class="term"><rect x="60" y="350" width="1380" height="66"/>
      <text x="86" y="378"><tspan class="p">$</tspan> ../phase1-local-cluster/up.sh   <tspan class="out"># minikube + the demo stack with the broken payments-1</tspan></text>
      <text x="86" y="402"><tspan class="out">  then set USE_REAL_CLUSTER=true in .env and .env.local  (false = built-in mock data, no cluster needed)</tspan></text></g>
      <g class="num"><circle cx="60" cy="350" r="13"/><text x="60" y="355">5</text></g></g>
    <g data-step="6"><g class="term"><rect x="60" y="432" width="1380" height="50"/>
      <text x="86" y="463"><tspan class="p">$</tspan> npx trigger.dev@latest dev     <tspan class="out"># terminal 1 — runs the agent locally, hot-reloads on save</tspan></text></g>
      <g class="num"><circle cx="60" cy="432" r="13"/><text x="60" y="437">6</text></g></g>
    <g data-step="7"><g class="term"><rect x="60" y="498" width="1380" height="66"/>
      <text x="86" y="526"><tspan class="p">$</tspan> npm run dev                    <tspan class="out"># terminal 2 — the chat UI</tspan></text>
      <text x="86" y="550"><tspan class="out">  open http://localhost:3000 and ask:  "why is payments crashing?"</tspan></text></g>
      <g class="num"><circle cx="60" cy="498" r="13"/><text x="60" y="503">7</text></g></g>
  </svg>

    <!-- beat 1: the four files -->
    <g data-step="1">
      <g class="plain"><rect x="40" y="160" width="1420" height="120"/>
        <text class="ttl" x="70" y="192">Four files. One job each.</text>
        <text class="li" x="70" y="226">chat.tsx — the screen you type into   ·   actions.ts — lets the browser in safely   ·   chat-agent.ts — the agent's brain loop   ·   tools.ts — its hands (kubectl)</text>
        <text class="li" x="70" y="256">Everything else in the repo is config. Let's start with the screen.</text></g>
    </g>
    <!-- beat 2: transport -->
    <g data-step="2">
      <path class="wire w-you" d="M280,134 H592" marker-end="url(#ah)"/><text class="lbl" x="440" y="150">talks to Trigger — never to OpenAI directly</text>
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">app/components/chat.tsx</text>
        <text x="64" y="222"><tspan class="k">const</tspan> transport = useTriggerChatTransport&lt;<tspan class="k">typeof</tspan> opsChat&gt;({</text>
        <text x="64" y="246">  task: <tspan class="s">"ops-chat"</tspan>,                                  <tspan class="c">// the agent to talk to</tspan></text>
        <text x="64" y="270">  accessToken:  ({ chatId }) =&gt; mintChatAccessToken(chatId),</text>
        <text x="64" y="294">  startSession: ({ chatId, clientData }) =&gt; startChatSession({ chatId, clientData }),</text>
        <text x="64" y="318">});</text>
        <text x="64" y="354"><tspan class="k">const</tspan> { messages, sendMessage, addToolOutput, stop, status } = useChat({</text>
        <text x="64" y="378">  transport,                                         <tspan class="c">// standard Vercel AI SDK hook</tspan></text>
        <text x="64" y="402">  sendAutomaticallyWhen: lastAssistantMessageIsCompleteWithToolCalls,</text>
        <text x="64" y="426">});</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• useChat is the normal chat hook from the</text><text class="li" x="994" y="252">  Vercel AI SDK — nothing exotic.</text>
        <text class="li" x="994" y="290">• The only change: a Trigger.dev transport.</text><text class="li" x="994" y="314">  Messages go to a durable session, not an</text><text class="li" x="994" y="338">  API route.</text>
        <text class="li" x="994" y="376">• The browser keeps NO history. It only ever</text><text class="li" x="994" y="400">  sends the new message.</text></g>
    </g>
    <!-- beat 3: rendering parts -->
    <g data-step="3">
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">app/components/chat.tsx — rendering</text>
        <text x="64" y="222">{messages.map((m) =&gt; (</text>
        <text x="64" y="246">  &lt;div className={`msg ${m.role}`}&gt;         <tspan class="c">// 🧑 you or 🤖 agent</tspan></text>
        <text x="64" y="270">    {m.parts.map((part) =&gt; {</text>
        <text x="64" y="294">      <tspan class="k">if</tspan> (part.type === <tspan class="s">"text"</tspan>)   <tspan class="k">return</tspan> &lt;p&gt;{part.text}&lt;/p&gt;;</text>
        <text x="64" y="318">      <tspan class="k">if</tspan> (part.type.startsWith(<tspan class="s">"tool-"</tspan>))</text>
        <text x="64" y="342">        <tspan class="k">return</tspan> &lt;p className=<tspan class="s">"tool"</tspan>&gt;🔧 {name} · {part.state}&lt;/p&gt;;</text>
        <text x="64" y="366">    })}</text>
        <text x="64" y="390">  &lt;/div&gt;</text>
        <text x="64" y="414">))}</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• A message is a list of "parts".</text>
        <text class="li" x="994" y="266">• Text parts → normal paragraphs.</text>
        <text class="li" x="994" y="304">• Tool parts → the little 🔧 lines you saw:</text><text class="li" x="994" y="328">  "getPods · output-available".</text>
        <text class="li" x="994" y="366">• That's how the viewer sees the agent</text><text class="li" x="994" y="390">  think — every kubectl call, live.</text></g>
    </g>

      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">app/components/chat.tsx — the approval card</text>
        <text x="64" y="222"><tspan class="k">if</tspan> (part.type === <tspan class="s">"tool-proposeDeletion"</tspan> &amp;&amp; part.state === <tspan class="s">"input-available"</tspan>) {</text>

        <text x="64" y="270">    &lt;div className=<tspan class="s">"approval"</tspan>&gt;</text>
        <text x="64" y="294">      ⚠ Approval needed: delete pod {part.input.pod} — {part.input.reason}</text>
        <text x="64" y="318">      &lt;button onClick={() =&gt; <tspan class="g">addToolOutput</tspan>({ tool: <tspan class="s">"proposeDeletion"</tspan>,</text>
        <text x="64" y="342">          toolCallId: part.toolCallId, output: { <tspan class="g">approved: true</tspan> } })}&gt;✅ Approve&lt;/button&gt;</text>
        <text x="64" y="366">      &lt;button onClick={() =&gt; addToolOutput({ …, output: { <tspan class="hot">approved: false</tspan> } })}&gt;❌ Deny&lt;/button&gt;</text>
        <text x="64" y="390">    &lt;/div&gt;</text>
        <text x="64" y="414">  );</text>
        <text x="64" y="438">}</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• The agent "asks" by calling a tool that has</text><text class="li" x="994" y="252">  no code behind it — so it pauses.</text>
        <text class="li" x="994" y="290">• While it's paused, we draw the card.</text>
        <text class="li" x="994" y="328">• Your click IS the tool's result:</text><text class="li" x="994" y="352">  { approved: true } or { approved: false }.</text>
        <text class="li" x="994" y="390">• Same code handles the memory-limit card.</text></g>
    </g>
    <!-- beat 5: auto resend -->
    <g data-step="5">
      <path class="wire w-hitl" d="M280,134 H592" marker-end="url(#ah)"/><text class="lbl" x="440" y="150">your answer goes back → agent resumes</text>
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">app/components/chat.tsx — one line that makes the button work</text>
        <text x="64" y="232">useChat({</text>
        <text x="64" y="256">  transport,</text>
        <text x="64" y="280">  <tspan class="g">sendAutomaticallyWhen: lastAssistantMessageIsCompleteWithToolCalls,</tspan></text>
        <text x="64" y="304">});</text>
        <text x="64" y="352" class="c">// "as soon as every pending tool call has an answer, send the</text>
        <text x="64" y="376" class="c">//  conversation again" → the agent wakes up and continues the same turn.</text>
        <text x="64" y="424" class="c">// Without this line: you click ✅ … and nothing happens.</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• Clicking Approve fills in the tool's answer.</text>
        <text class="li" x="994" y="266">• This one line says: the moment that happens,</text><text class="li" x="994" y="290">  re-send — don't wait for me to type.</text>
        <text class="li" x="994" y="328">• That's why the agent continues by itself</text><text class="li" x="994" y="352">  right after you click.</text></g>
    </g>
    <!-- beat 6: send / stop -->
    <g data-step="6">
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">app/components/chat.tsx — the input</text>
        <text x="64" y="222">&lt;form onSubmit={(e) =&gt; { e.preventDefault(); <tspan class="g">sendMessage</tspan>({ text: input }); setInput(<tspan class="s">""</tspan>); }}&gt;</text>
        <text x="64" y="246">  &lt;input value={input} onChange={(e) =&gt; setInput(e.target.value)} /&gt;</text>
        <text x="64" y="270">  &lt;button type=<tspan class="s">"submit"</tspan> disabled={status === <tspan class="s">"streaming"</tspan>}&gt;Send&lt;/button&gt;</text>
        <text x="64" y="294">  {status === <tspan class="s">"streaming"</tspan> &amp;&amp; &lt;button onClick={<tspan class="g">stop</tspan>}&gt;⏹ Stop&lt;/button&gt;}</text>
        <text x="64" y="318">&lt;/form&gt;</text>
        <text x="64" y="366" class="c">// sendMessage: only the new text crosses the wire.</text>
        <text x="64" y="390" class="c">// stop: aborts generation on the SERVER too (see abortSignal in chat-agent.ts),</text>
        <text x="64" y="414" class="c">// not just in the browser.</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• Send = one new message, nothing else.</text>
        <text class="li" x="994" y="266">• Stop really stops the model — on Trigger's</text><text class="li" x="994" y="290">  side — not just the animation.</text>
        <text class="li" x="994" y="328">• That's the whole UI. ~150 lines including</text><text class="li" x="994" y="352">  the card. Now the interesting part: the</text><text class="li" x="994" y="376">  server side.</text></g>
    </g>
  </svg>

    <g data-step="1">
      <path class="wire w-next" d="M560,134 H592" marker-end="url(#ah)"/><path class="wire w-next" d="M280,134 H312" marker-end="url(#ah)"/><text class="lbl" x="440" y="150">opens the door safely</text>
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">app/actions.ts — the whole file</text>
        <text x="64" y="222"><tspan class="s">"use server"</tspan>;</text>
        <text x="64" y="258"><tspan class="k">export const</tspan> startChatSession = chat.<tspan class="g">createStartSessionAction</tspan>(<tspan class="s">"ops-chat"</tspan>);</text>
        <text x="64" y="294"><tspan class="k">export async function</tspan> mintChatAccessToken(chatId: string) {</text>
        <text x="64" y="318">  <tspan class="k">return</tspan> auth.<tspan class="g">createPublicToken</tspan>({</text>
        <text x="64" y="342">    scopes: { read: { sessions: chatId }, write: { sessions: chatId } },   <tspan class="c">// this chat only</tspan></text>
        <text x="64" y="366">    expirationTime: <tspan class="s">"1h"</tspan>,</text>
        <text x="64" y="390">  });</text>
        <text x="64" y="414">}</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• Two tiny server functions. That's the</text><text class="li" x="994" y="252">  entire Next.js backend.</text>
        <text class="li" x="994" y="290">• One starts (or resumes) the durable session.</text>
        <text class="li" x="994" y="328">• One hands the browser a 1-hour key that</text><text class="li" x="994" y="352">  works for this one chat and nothing else.</text>
        <text class="li" x="994" y="390">• Your real secret key never leaves the server.</text></g>
    </g>
    <!-- beat 2: chat.agent -->
    <g data-step="2">
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">trigger/chat-agent.ts — the agent is one function</text>
        <text x="64" y="222"><tspan class="k">export const</tspan> opsChat = <tspan class="g">chat.agent</tspan>({</text>
        <text x="64" y="246">  id: <tspan class="s">"ops-chat"</tspan>,                <tspan class="c">// the name the UI's transport points at</tspan></text>
        <text x="64" y="270">  tools: clusterTools,           <tspan class="c">// its hands — from lib/tools.ts</tspan></text>
        <text x="64" y="294">  run: <tspan class="k">async</tspan> ({ messages, tools, signal }) =&gt;</text>
        <text x="64" y="318">    streamText({ <tspan class="c">/* next slide */</tspan> }),</text>
        <text x="64" y="342">});</text>
        <text x="64" y="390" class="c">// That's it. chat.agent turns this into a long-running, pausable process:</text>
        <text x="64" y="414" class="c">// wakes on every message, remembers the whole conversation, survives redeploys.</text></g>
      <g class="plain"><rect x="970" y="160" width="490" height="300"/><text class="ttl" x="994" y="192">In plain English</text>
        <text class="li" x="994" y="228">• This is where the agent lives — on</text><text class="li" x="994" y="252">  Trigger.dev, not in a web request.</text>
        <text class="li" x="994" y="290">• run() is called once per turn, with the full</text><text class="li" x="994" y="314">  history already loaded for you.</text>
        <text class="li" x="994" y="352">• Between turns the process sleeps. It costs</text><text class="li" x="994" y="376">  nothing while it waits for you.</text></g>
    </g>

    <g data-step="3">
      <path class="wire w-ai" d="M900,134 H932" marker-end="url(#ah)"/><text class="lbl" x="1050" y="150">asks the AI, every turn</text>
      <g class="code"><rect x="40" y="160" width="900" height="300"/><text class="h" x="64" y="188">trigger/chat-agent.ts — inside run()</text>
        <text x="64" y="222">streamText({</text>
        <text x="64" y="246">  <tspan class="g">...chat.toStreamTextOptions({ tools })</tspan>,   <tspan class="c">// ← Trigger's plumbing: history, tools, pausing</tspan></text>
        <text x="64" y="270">  model: <tspan class="g">openai.chat</tspan>(<tspan class="s">"gpt-5-mini"</tspan>),        <tspan class="c">// plain Chat Completions — stateless, resumes cleanly</tspan></text>
        <text x="64" y="294">  system: SYSTEM_PROMPT,                    <tspan class="c">// the rules (next slide)</tspan></text>
        <text x="64" y="318">  messages,                                 <tspan class="c">// the whole conversation so far</tspan></text>
        <text x="64" y="342">  abortSignal: signal,                      <tspan class="c">// makes the UI's Stop button real</tspan></text>
        <text x="64" y="366">  stopWhen: stepCountIs(15),                <tspan class="c">// max tool calls per turn</tspan></text>

        <text x="64" y="222">You are an SRE assistant for a small shop platform on Kubernetes.</text>

        <text x="64" y="294">}),</text>

        <text x="64" y="270">    { name: workload, resources: { limits: { memory }, requests: { memory } } } ] } } } };</text>
        <text x="64" y="294">  <tspan class="k">await</tspan> kubectl([<tspan class="s">"patch"</tspan>, <tspan class="s">"statefulset"</tspan>, workload, <tspan class="s">"-n"</tspan>, namespace, <tspan class="s">"-p"</tspan>, JSON.stringify(patch)]);</text>
        <text x="64" y="318">  <tspan class="k">return</tspan> kubectl([<tspan class="s">"rollout"</tspan>, <tspan class="s">"status"</tspan>, `statefulset/${workload}`, <tspan class="s">"-n"</tspan>, namespace]);</text>

<script>
  // [act, title, sentence, command?, glow box id?]
  const steps = [
    [0,"Clone the repo","Two folders matter: phase2-chat-agent (the agent) and phase1-local-cluster (the demo cluster).","git clone https://github.com/rahulwagh/trigger-dev-ai-agent.git && cd trigger-dev-ai-agent/phase2-chat-agent"],
    [0,"Install the packages","Next.js, the Vercel AI SDK, the Trigger.dev SDK and the OpenAI provider. Nothing else.","npm install"],
    [0,"Add your two keys","A Trigger.dev dev key and an OpenAI key. The worker reads .env, Next.js reads .env.local — so copy it twice.","cp .env.example .env.local && cp .env.local .env"],
    [0,"Link to your Trigger.dev project","Creates the project ref in trigger.config.ts. Get the ref from your project's dashboard.","npx trigger.dev@latest init -p <your-project-ref>"],
    [0,"Start the demo cluster (optional)","Minikube plus the broken payments-1. Skip it and set USE_REAL_CLUSTER=false to use built-in mock data.","../phase1-local-cluster/up.sh"],
    [0,"Terminal 1 — run the agent","This runs the chat.agent task locally and hot-reloads when you save.","npx trigger.dev@latest dev"],
    [0,"Terminal 2 — run the chat UI","Open localhost:3000 and ask the question from the demo.","npm run dev"],
    [1,"Four files, one job each","Keep this map in your head: screen · door · brain · hands.",null,"a1-you"],
    [1,"The chat hook — with a Trigger transport","Standard useChat. The only change is where messages go: a durable Trigger.dev session.",null,"a1-you"],
    [1,"Rendering what the agent does","Text parts become paragraphs; tool parts become the 🔧 lines — so you watch it think.",null,"a1-you"],
    [1,"The approval card","When the agent asks, we draw a card. Your click becomes the tool's answer.",null,"a1-you"],
    [1,"The one line that makes ✅ work","Auto re-send once every pending question has an answer — the agent resumes on its own.",null,"a1-you"],
    [1,"Send and Stop","One new message per send. Stop really stops the model on the server.",null,"a1-you"],
    [2,"actions.ts — opening the door safely","Two server functions: start the session, mint a key for this one chat. The secret stays on the server.",null,"a2-next"],
    [2,"chat.agent — the agent is one function","This is where the agent lives: a long-running, pausable process on Trigger.dev.",null,"a2-trigger"],
    [2,"streamText — asking the AI","The standard AI SDK call, plus one spread that plugs in Trigger's durable plumbing.",null,"a2-trigger"],
    [2,"The policy, written in English","Look freely. Propose before you touch. Restart is triage; the limit is the fix.",null,"a2-trigger"],
    [2,"Read-only tools — its hands","getPods and getPodLogs just run kubectl and return the text. No approval needed.",null,"a2-k8s"],
    [2,"The gate — ask first, then act","A tool with no code pauses the agent. The real action is a separate tool, forbidden until ✅.",null,"a2-trigger"],
    [2,"The permanent fix","kubectl patch, then wait for the rollout — same commands you'd type, behind the same gate.",null,"a2-k8s"],
    [2,"Config — that's everything","One project ref, two keys, one flag. One deploy command moves it to the cloud.",null,"a2-trigger"],
  ];
  const MAX = steps.length; let cur = 0, timer = null;
  const cap = document.getElementById("cap"), dots = document.getElementById("dots"), acts = [...document.querySelectorAll(".act")];
  const prevB = document.getElementById("prev"), nextB = document.getElementById("next"), playB = document.getElementById("play");
  steps.forEach(() => dots.appendChild(document.createElement("i")));
  const firstOf = a => steps.findIndex(s => s[0] === a);
  function render(fresh){
    const act = cur ? steps[cur-1][0] : 0, local = cur ? cur - firstOf(act) : 0;
    [0,1,2].forEach(a => { const svg = document.getElementById("act"+a); svg.style.display = a === act ? "block" : "none";
      svg.querySelectorAll("[data-step]").forEach(el => { const s = +el.dataset.step;
        // code acts: show only the current beat (not stacked); commands act: stack them
        const stacked = a === 0;
        el.classList.toggle("off", stacked ? s > local : s !== local);
        el.classList.toggle("done", stacked && s < local);
        el.classList.toggle("fresh", fresh && s === local); }); });
    acts.forEach(el => el.classList.toggle("on", +el.dataset.act === act));
    document.querySelectorAll(".box").forEach(b => { b.classList.remove("glow","glowg"); });
    const st = cur ? steps[cur-1] : null;
    if (st && st[4]) { const b = document.getElementById(st[4]); if (b) b.classList.add(st[4].endsWith("trigger") || st[4].endsWith("k8s") ? "glowg" : "glow"); }
    cap.querySelector("b").textContent = st ? `${local}. ${st[1]}` : "Press ▶ Play — or use the arrow keys";
    cap.querySelector("span").textContent = st ? st[2] : "Three acts: run it yourself, the chat UI, and how Trigger.dev is wired in.";
    const code = cap.querySelector("code"); code.hidden = !(st && st[3]); if (st && st[3]) code.textContent = st[3];
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i < cur));
    prevB.disabled = cur === 0; nextB.disabled = cur === MAX;
  }
  function go(d){ const n = Math.min(MAX, Math.max(0, cur + d)); if (n !== cur){ cur = n; render(d > 0); } if (cur === MAX) stop(); }
  function play(){ if (cur === MAX) cur = 0; timer = setInterval(() => go(1), 7000); playB.textContent = "⏸ Pause"; go(1); }
  function stop(){ clearInterval(timer); timer = null; playB.textContent = "▶ Play"; }
  playB.onclick = () => timer ? stop() : play();
  prevB.onclick = () => { stop(); go(-1); }; nextB.onclick = () => { stop(); go(1); };
  acts.forEach(el => el.onclick = () => { stop(); cur = firstOf(+el.dataset.act) + 1; render(true); });
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); stop(); go(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stop(); go(-1); }
    else if (e.key === " ") { e.preventDefault(); timer ? stop() : play(); }
  });
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("step")) cur = Math.min(MAX, Math.max(0, +h.get("step") || 0));
  if (h.has("clean")) { document.querySelector(".ctrl").style.display = "none"; document.querySelector(".hint").style.display = "none"; }
  render(false);
</script>
