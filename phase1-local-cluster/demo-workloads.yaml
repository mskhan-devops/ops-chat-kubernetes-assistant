# Phase 1 (local edition): the demo shop stack on minikube.
# payments-1 is DELIBERATELY broken: it logs Redis connection failures, then
# allocates memory past its 32Mi limit → real OOMKilled (exit 137) → CrashLoopBackOff.
# payments-0 stays healthy so the agent sees "one replica is fine".
apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: demo }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: demo }
spec: { selector: { app: redis }, ports: [{ port: 6379, targetPort: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -u +%FT%TZ) INFO orders: GET /orders 200 (redis ok)\"; sleep 5; done"]
          resources: { limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: demo }
spec: { selector: { app: orders }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: payments, namespace: demo }
spec:
  serviceName: payments
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          resources: { limits: { memory: 32Mi }, requests: { memory: 16Mi } }
          command:
            - sh
            - -c
            - |
              if [ "$HOSTNAME" = "payments-1" ]; then
                i=1; while [ $i -le 5 ]; do
                  echo "$(date -u +%FT%TZ) ERROR payments: ECONNREFUSED redis:6379 (retry $i/15)"; sleep 1; i=$((i+1));
                done
                echo "$(date -u +%FT%TZ) ERROR payments: heap out of memory — allocation failed"
                echo "$(date -u +%FT%TZ) FATAL payments: worker exiting (retry buffer exhausted memory)"
                # needs ~100MB held by THIS process (peak ~2x while the shell grows the
                # buffer): inside the 32Mi limit the kernel OOM-kills it (exit 137);
                # raise the limit to 256Mi or more and it succeeds → serves
                buf=$(head -c 100m /dev/zero | tr '\0' a)
                [ "${#buf}" -lt 104857600 ] && { echo "FATAL payments: OOM during retry-buffer alloc"; exit 137; }
                echo "$(date -u +%FT%TZ) INFO payments: cache warmed, redis reconnected — serving"
                while true; do echo "$(date -u +%FT%TZ) INFO payments: POST /pay 200 (redis ok)"; sleep 5; done
              else
                while true; do echo "$(date -u +%FT%TZ) INFO payments: POST /pay 200 (redis ok)"; sleep 5; done
              fi
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: demo }
spec: { selector: { app: payments }, ports: [{ port: 8080, targetPort: 8080 }] }
